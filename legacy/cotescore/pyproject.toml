[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cotescore"
version = "0.4.0"
description = "Deprecated: cotescore has been replaced by mote_error"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "Jonathan Bourne"},
    {name = "Mwiza Simbeye"}
]
classifiers = [
    "Development Status :: 7 - Inactive",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "mote_error",
]

[project.urls]
Homepage = "https://github.com/THE-3TC/mote_error"
Repository = "https://github.com/THE-3TC/mote_error"

[tool.setuptools.packages.find]
where = ["src"]
